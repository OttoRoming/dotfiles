[Settings]
# --- Theme & Icons ---
# GTK 4 resolves a dark theme through the theme variant: with dark mode
# preferred it loads the theme's gtk-dark.css. Breeze/gtk-4.0/gtk-dark.css
# imports Breeze-Dark, while Breeze-Dark itself has no gtk-dark.css — naming
# "Breeze-Dark" here would make GTK fall back to the default theme.
gtk-theme-name=Breeze
gtk-icon-theme-name=breeze-dark
gtk-interface-color-scheme=dark
# Kept for GTK 4 versions before 4.20, where the key above does not exist.
gtk-application-prefer-dark-theme=1

# --- Cursor ---
gtk-cursor-theme-name=breeze_cursors
gtk-cursor-theme-size=24

# --- Font ---
# fontconfig maps sans-serif to Noto Sans (see
# ~/.config/fontconfig/fonts.conf), matching the GTK 3 setting.
gtk-font-name=Noto Sans 11

# --- Font Rendering (RGB Subpixel) ---
# GTK 4 defaults to automatic rendering, which ignores the gtk-xft-* keys.
# "manual" preserves the hinting/antialiasing choices from GTK 3.
gtk-font-rendering=manual
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-hint-font-metrics=1
# gtk-xft-rgba is not copied: GTK 4 renders through GSK, which only does
# grayscale antialiasing, so RGB subpixel order has no effect.

# --- Miscellaneous ---
gtk-enable-event-sounds=0
gtk-enable-input-feedback-sounds=0
