# Window effects
border_radius = 0
border_px = 2
unfocused_opacity = 0.95

# remove corner radius everywhere
no_radius_when_single=0
group_bar_decorate_corner_radius=0
tab_bar_decorate_corner_radius=0
jump_label_decorate_corner_radius=0
title_message_bar_decorate_corner_radius=0

# animations
animations = 0

# master stack
new_is_master = 1

# overview
enable_hotarea = 0

# keyboard
repeat_rate = 30
repeat_delay = 300
numlock_on = 1

# trackpad & mouse
mouse_accel_profile = 0
mouse_accel_speed = 0.0
trackpad_accel_profile = 0
trackpad_accel_speed = 0.0
trackpad_disable_while_typing = 0

tag_rule = id:1,layout_name:tile
tag_rule = id:2,layout_name:tile
tag_rule = id:3,layout_name:tile
tag_rule = id:4,layout_name:tile
tag_rule = id:5,layout_name:tile
tag_rule = id:6,layout_name:tile
tag_rule = id:7,layout_name:tile
tag_rule = id:8,layout_name:tile
tag_rule = id:9,layout_name:tile

# theme (gruvbox dark)
# window borders and states
root_color=0x282828ff
border_color=0x504945ff
focus_color=0xcc241dff
urgent_color=0xfb4934ff
maximized_screen_color=0x98971aff
scratchpad_color=0x458588ff
global_color=0xb16286ff
overlay_color=0x689d6aff
split_color=0xd79921ff
drop_color=0x83a59880
shadows_color=0x282828a0
dim_focused_color=0x28282800
dim_unfocused_color=0x28282880

# group bar
group_bar_button_color=0xfb4934ff
group_bar_decorate_bg_color=0x3c3836ff
group_bar_decorate_fg_color=0xa89984ff
group_bar_decorate_focus_bg_color=0xcc241dff
group_bar_decorate_focus_fg_color=0xfbf1c7ff
group_bar_decorate_border_color=0x504945ff

# tab bar
tab_bar_decorate_bg_color=0x3c3836ff
tab_bar_decorate_fg_color=0xa89984ff
tab_bar_decorate_focus_bg_color=0xcc241dff
tab_bar_decorate_focus_fg_color=0xfbf1c7ff
tab_bar_decorate_border_color=0x504945ff

# jump labels
jump_label_decorate_bg_color=0x3c3836ff
jump_label_decorate_fg_color=0xebdbb2ff
jump_label_decorate_focus_bg_color=0xcc241dff
jump_label_decorate_focus_fg_color=0xfbf1c7ff
jump_label_decorate_border_color=0x504945ff

# title message bar
title_message_bar_decorate_bg_color=0x3c3836ff
title_message_bar_decorate_fg_color=0xebdbb2ff
title_message_bar_decorate_focus_bg_color=0x504945ff
title_message_bar_decorate_focus_fg_color=0xfbf1c7ff
title_message_bar_decorate_border_color=0x504945ff


# layout
xkb_rules_layout = us,se
xkb_rules_variant = colemak,nodeadkeys
xkb_rules_options = grp:win_space_toggle


# binds
binds = SUPER,t,spawn,footclient
binds = SUPER,b,spawn,firefox
binds = SUPER+SHIFT,q,spawn,~/.local/bin/menu-power
binds = SUPER+SHIFT,l,spawn,~/.local/bin/lock
binds = ALT,space,spawn,~/.local/bin/menu-run

binds = SUPER+CTRL,c,spawn,~/.local/bin/menu-clipboard
binds = SUPER+CTRL,a,spawn,~/.local/bin/menu-audio
binds = SUPER+CTRL,b,spawn,~/.local/bin/menu-bluetooth

binds = SUPER,v,setlayout,tile
binds = SUPER,f,togglefloating
binds = SUPER,m,setlayout,monocle
binds = SUPER,g,setlayout,fair
binds = SUPER,d,setlayout,dwindle

binds = SUPER,j,focusstack,next
binds = SUPER,k,focusstack,prev
binds = SUPER,h,setmfact,-0.05
binds = SUPER,l,setmfact,+0.05
binds = SUPER,Return,zoom
binds = SUPER+SHIFT,c,killclient
binds = SUPER+SHIFT,r,reload_config
binds = SUPER,code:60,focusmon,right
binds = SUPER+SHIFT,code:60,tagmon,right,0

binds = SUPER,1,comboview,1
binds = SUPER,2,comboview,2
binds = SUPER,3,comboview,3
binds = SUPER,4,comboview,4
binds = SUPER,5,comboview,5
binds = SUPER,6,comboview,6
binds = SUPER,7,comboview,7
binds = SUPER,8,comboview,8
binds = SUPER,9,comboview,9
binds = SUPER,0,view,0

bind = SUPER+SHIFT,1,tag,1
bind = SUPER+SHIFT,2,tag,2
bind = SUPER+SHIFT,3,tag,3
bind = SUPER+SHIFT,4,tag,4
bind = SUPER+SHIFT,5,tag,5
bind = SUPER+SHIFT,6,tag,6
bind = SUPER+SHIFT,7,tag,7
bind = SUPER+SHIFT,8,tag,8
bind = SUPER+SHIFT,9,tag,9
bind = SUPER+SHIFT,0,toggletag,0

binds = SUPER+SHIFT,Up,exchange_client,up
binds = SUPER+SHIFT,Down,exchange_client,down
binds = SUPER+SHIFT,Left,exchange_client,left
binds = SUPER+SHIFT,Right,exchange_client,right

bind = NONE,XF86MonBrightnessUp,spawn,brightnessctl s +2%
bind = SHIFT,XF86MonBrightnessUp,spawn,brightnessctl s 100%
bind = NONE,XF86MonBrightnessDown,spawn,brightnessctl s 2%-
bind = SHIFT,XF86MonBrightnessDown,spawn,brightnessctl s 0

bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle

bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause

binds = NONE,Print,spawn,~/.local/bin/screenshot

# Mouse Button Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

monitor_rule=name:HDMI-A-1,x:0,y:0
monitor_rule=name:eDP-1,x:0,y:0
monitor_rule=name:DVI-D-1,x:-1080,y:0,rr:1 # sweet-jp second monitor

exec_once = openrc -U wayland
exec_once = swaybg -m fill -i ~/Pictures/wallpapers/jonathan-curry.jpg
exec_once = wired
exec_once = waybar
exec_once = wl-paste --watch cliphist store
exec_once = syshud
exec_once = /usr/lib/mate-polkit/polkit-mate-authentication-agent-1 # archlinux
exec_once = /usr/libexec/polkit-mate-authentication-agent-1 # alpinelinux
exec_once = foot --server
exec_once = wayneko --layer top
exec_once = brightnessctl s 100%
exec_once = gsettings set org.gnome.desktop.interface color-scheme prefer-dark

