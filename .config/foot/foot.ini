# foot: Wayland terminal
# Theme colors live in ~/.cache/theme/foot-colors.ini and are generated from
# theme.json by process.py, just like the alacritty colors.

include=~/.cache/theme/foot-colors.ini

[main]
# Match ~/.config/alacritty/alacritty.toml and the old WezTerm layout.
font=Hack:size=14
dpi-aware=no
pad=8x8
initial-color-theme=dark
bold-text-in-bright=no

[cursor]
style=block
blink=no
unfocused-style=hollow

[scrollback]
lines=10000

[csd]
# Mango draws the window border; don't add a client-side titlebar.
preferred=none
