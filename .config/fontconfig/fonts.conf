<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- Generic sans-serif -> Arimo, with Nerd/symbol/emoji fallbacks -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Arimo Nerd Font</family>
      <family>Arimo</family>
      <family>Noto Sans</family>
      <family>Symbols Nerd Font</family>
      <family>Noto Color Emoji</family>
      <family>Noto Emoji</family>
    </prefer>
  </alias>

  <!-- Generic serif -> Noto Serif, with emoji fallbacks -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Color Emoji</family>
      <family>Noto Emoji</family>
    </prefer>
  </alias>

  <!-- Generic monospace -> Hack Nerd Font first, then fallbacks -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Hack Nerd Font</family>
      <family>Hack</family>
      <family>BlexMono Nerd Font</family>
      <family>IBM Plex Mono</family>
      <family>RobotoMono Nerd Font</family>
      <family>Roboto Mono</family>
      <family>Noto Color Emoji</family>
      <family>Noto Emoji</family>
    </prefer>
  </alias>

</fontconfig>
