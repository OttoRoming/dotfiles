# Generated by process.py from templates/foot-colors.ini.
#
# Included by ~/.config/foot/foot.ini. Foot takes plain RRGGBB values here,
# without a leading '#'; this matches the same theme.json palette used by
# alacritty, waybar and the shared Lua colors module.

[colors-dark]
alpha=1.0
foreground=@foreground@
background=@background@

# Text color, then cursor color (same inversion as alacritty).
cursor=@background@ @foreground@
selection-foreground=@background@
selection-background=@foreground@

regular0=@black@
regular1=@red@
regular2=@green@
regular3=@yellow@
regular4=@blue@
regular5=@magenta@
regular6=@cyan@
regular7=@white@

bright0=@bright_black@
bright1=@bright_red@
bright2=@bright_green@
bright3=@bright_yellow@
bright4=@bright_blue@
bright5=@bright_magenta@
bright6=@bright_cyan@
bright7=@bright_white@

scrollback-indicator=@foreground@ @primary@
flash=@primary@
flash-alpha=0.25
dim-blend-towards=black

[colors-light]
alpha=1.0
foreground=@foreground@
background=@background@

cursor=@background@ @foreground@
selection-foreground=@background@
selection-background=@foreground@

regular0=@black@
regular1=@red@
regular2=@green@
regular3=@yellow@
regular4=@blue@
regular5=@magenta@
regular6=@cyan@
regular7=@white@

bright0=@bright_black@
bright1=@bright_red@
bright2=@bright_green@
bright3=@bright_yellow@
bright4=@bright_blue@
bright5=@bright_magenta@
bright6=@bright_cyan@
bright7=@bright_white@

scrollback-indicator=@foreground@ @primary@
flash=@primary@
flash-alpha=0.25
dim-blend-towards=white
